name: pixguard

x-app: &app
  image: pixguard-ai:local
  build:
    context: .
  init: true
  environment: &environment
    PIXGUARD_DATA_DIR: /data/pixguard
    PIXGUARD_KAFKA_BOOTSTRAP_SERVERS: ${PIXGUARD_KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
    PIXGUARD_KAFKA_TOPIC: ${PIXGUARD_KAFKA_TOPIC:-pixguard.payment_event_v1}
    PIXGUARD_EVENT_COUNT: ${PIXGUARD_EVENT_COUNT:-100000}
    PIXGUARD_SEED: ${PIXGUARD_SEED:-42}
  volumes:
    - pixguard_data:/data/pixguard
  networks:
    - backend
  mem_limit: 512m
  cpus: 1.0
  pids_limit: 128
  security_opt:
    - no-new-privileges:true
  healthcheck:
    test: ["CMD", "pixguard", "check-storage"]
    interval: 15s
    timeout: 5s
    retries: 3
    start_period: 10s

services:
  kafka:
    image: apache/kafka:4.4.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend
    mem_limit: 1g
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "kafka:9092", "--list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  redpanda-console:
    image: docker.redpanda.com/redpandadata/console:v3.14.0
    environment:
      KAFKA_BROKERS: kafka:9092
    ports:
      - "127.0.0.1:${PIXGUARD_KAFKA_CONSOLE_PORT:-8080}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - backend
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

  app:
    <<: *app
    command: ["pixguard", "idle"]
    depends_on:
      kafka:
        condition: service_healthy

  # Reserved execution shell; Spark is introduced by the later pipeline task.
  pipeline:
    <<: *app
    profiles: ["pipeline"]
    command: ["pixguard", "idle"]
    depends_on:
      kafka:
        condition: service_healthy

  # Starts Streamlit once the dashboard module from UI-001 exists.
  dashboard:
    <<: *app
    command: ["pixguard", "dashboard"]
    ports:
      - "127.0.0.1:${PIXGUARD_DASHBOARD_PORT:-8501}:8501"
    depends_on:
      app:
        condition: service_healthy

volumes:
  pixguard_data:
  kafka_data:

networks:
  backend:
    driver: bridge
